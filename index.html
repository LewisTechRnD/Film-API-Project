<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <title>API Film Search App</title>
  <link rel="stylesheet" href="style.css" />
  <script src="script.js"></script>
</head>
<body>
  <section id="landing">
    <nav>
        <div class="row nav__row">
            <div class="nav__logo">
            <div class="nav__logo--title">The Hall of Films</div>
              </div>  
            <div class="nav__links">
                <a href="#" class="nav__link">About</a>
                <a href="#" class="nav__link">Blog</a>
                <a href="#" class="nav__link">Rentals</a>
                <a href="#" class="nav__link">Contact</a>
                <a href="#" class="nav__link--login">Login</a>
                <a href="#" class="nav__link nav__link--primary">Sign Up</a>
            </div>
            <button class="btn__menu" onclick="openMenu()">
              <svg xmlns="http://www.w3.org/2000/svg" width="24" height="24" viewBox="0 0 24 24" fill="none"
              stroke="wheat" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"
              class="btn__menu--svg">
          <line x1="3" y1="12" x2="21" y2="12"></line>
          <line x1="3" y1="6" x2="21" y2="6"></line>
          <line x1="3" y1="18" x2="21" y2="18"></line>
          </svg>
          </button>
      </div>
  </nav>
  <div class="menu">
      <button class="btn__menu btn__menu--close" onclick="closeMenu()">
          <svg xmlns="http://www.w3.org/2000/svg" width="24" height="24" viewBox="0 0 24 24" fill="none"
          stroke="maroon" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"
          class="light___StyledCloseIcon-lj69nl-14 fASujC">
          <line x1="18" y1="6" x2="6" y2="18"></line>
          <line x1="6" y1="6" x2="18" y2="18"></line>
      </svg>
      </button>
      <div class="menu__links">
          <a class="menu__link" onclick="closeMenu()">About</a>
          <a class="menu__link" onclick="closeMenu()">Blog</a>
          <a class="menu__link" onclick="closeMenu()">Rentals</a>
          <a class="menu__link" onclick="closeMenu()">Contact</a>
          <a class="menu__link" onclick="closeMenu()">Login</a>
          <a class="menu__link menu__link--primary" onclick="closeMenu()">Sign Up</a>
      </div>
  </div>
    </nav>
  </section>
<main>
  <!-- Search -->
   
  <input type="text" id="searchInput" placeholder="Let's watch a movie..." />
  <button onclick="searchMovies()">Search</button>
  <div id="loading" class="hidden">Loading<span class="dots">...</span>
</div>
  <!-- Sort -->
  <select id="sortSelect" onchange="sortMovies()">
    <option value="">Sort</option>
    <option value="az">A → Z</option>
    <option value="za">Z → A</option>
    <option value="new">Newest → Oldest</option>
    <option value="old">Oldest → Newest</option>
  </select>


<div id="content">
  <img class= "movie__posters" src="./assets/03c085bf3e69ccb480a4bb3c0148794baa-evil-ai-movies.2x.rhorizontal.w1100.gif" alt="" class="movie__posters">

</div>

<div id="emptyState" class="hidden">
  <img src="./assets/popcorn-bag-png-05042024-wvohyjwe2vywdfdy.png" alt="No results found" />
  <h4>No movies found... Try another search.</h4>
</div>

  <!-- Results -->
  <div id="results"></div>
  <!--Plot Modal-->
  <div id="modal" class="modal hidden">
  <div class="modal-content">
    

    <img id="modalPoster" />

    <div class="modal-text">
      <h2 id="modalTitle"></h2>
      <p id="modalYear"></p>
      <p id="modalGenre"></p>
      <p id="modalPlot"></p>
    </div>

  </div>
</div>
</main>
  <!-- Footer -->
  <footer>
    <div class="row footer__row"></div>
    <div class="footer__copyright">Copyright © 2026 Cristopher Lewis</div>
  </footer>
</div>
</body>
</html>
