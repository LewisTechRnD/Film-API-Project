<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <title>API Film Search App</title>
  <link rel="stylesheet" href="style.css" />
  <script src="script.js"></script>
</head>
<body>
  <section id="landing">
    <nav>
        <div class="row nav__row">
            <div class="nav__logo">
            <div class="nav__logo--title">The Hall of Films</div>
              </div>  
            <div class="nav__links">
                <a href="#" class="nav__link">About</a>
                <a href="#" class="nav__link">Blog</a>
                <a href="#" class="nav__link">Rentals</a>
                <a href="#" class="nav__link">Contact</a>
                <a href="#" class="nav__link--login">Login</a>
                <a href="#" class="nav__link nav__link--primary">Sign Up</a>
            </div>
        </div>
    </nav>
  </section>
<main>
  <!-- Search -->
   
  <input type="text" id="searchInput" placeholder="Let's watch a movie..." />
  <button onclick="searchMovies()">Search</button>
  <div id="loading" class="hidden">Loading<span class="dots">...</span>
</div>
  <!-- Sort -->
  <select id="sortSelect" onchange="sortMovies()">
    <option value="">Sort</option>
    <option value="az">A → Z</option>
    <option value="za">Z → A</option>
    <option value="new">Newest → Oldest</option>
    <option value="old">Oldest → Newest</option>
  </select>


<div id="content">
  <img class= "movie__posters" src="./assets/Movie-theater-carpet-found-2016061716.svg" alt="" class="movie__posters">

</div>

<div id="emptyState" class="hidden">
  <img src="./assets/food-potcorn.svg" alt="No results found" />
  <h4>No movies found... Try another search.</h4>
</div>

  <!-- Results -->
  <div id="results"></div>
  <!--Plot Modal-->
  <div id="modal" class="modal hidden">
  <div class="modal-content">
    

    <img id="modalPoster" />

    <div class="modal-text">
      <h2 id="modalTitle"></h2>
      <p id="modalYear"></p>
      <p id="modalGenre"></p>
      <p id="modalPlot"></p>
    </div>

  </div>
</div>
</main>
  <!-- Footer -->
  <footer>
    <div class="row footer__row"></div>
    <div class="footer__copyright">Copyright © 2026 Cristopher Lewis</div>
  </footer>
</div>
</body>
</html>
